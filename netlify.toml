# Redirects para la mudanza de dominio (WordPress/Elementor -> este sitio Astro).
# Netlify procesa este archivo en cada deploy; ver "Deploy log" -> "Redirects".
# No se declara [build] aquí a propósito: se respeta la configuración de build/publish
# ya existente en el dashboard de Netlify (adapter @astrojs/netlify, output "server").

# 1) Dominio de trabajo de Netlify -> dominio final, para evitar contenido duplicado
#    una vez publicado en mdnpublicidad.com.
[[redirects]]
  from = "https://mdnpublicidad.netlify.app/*"
  to = "https://mdnpublicidad.com/:splat"
  status = 301
  force = true

